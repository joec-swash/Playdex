<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Game - Playdex</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Playdex</h1>
        <p>My games. My ratings. My reviews.</p>
    </header>

    <main>
        <h2>Add a Game</h2>

        <form method="POST">

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label for="title">Game title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >

            <label>Platform</label>

            {% include "_platform_picker.html" %}

            <label for="rating">Rating</label>

            <input
                type="number"
                id="rating"
                name="rating"
                min="0.1"
                max="10"
                step="0.1"
                required
            >

            <details class="advanced-logging">
                <summary>Advanced Logging Options</summary>

                <div class="advanced-logging-content">

                    <label for="achievements_complete">
                        Platinum/All achievements
                    </label>

                    <select
                        id="achievements_complete"
                        name="achievements_complete"
                    >
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>

                    <label for="hours_played">
                        Hours Played
                    </label>

                    <input
                        type="number"
                        id="hours_played"
                        name="hours_played"
                        min="0"
                        step="0.1"
                        placeholder="e.g. 42.5"
                    >

                </div>
            </details>
    
            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >
                <option value="">Choose status</option>
                <option value="Completed">Completed</option>
                <option value="Playing">Playing</option>
                <option value="Did not finish">Did not finish</option>
            </select>


            <label for="times_played">
                Times Played
            </label>

            <input
                type="number"
                id="times_played"
                name="times_played"
                min="0"
                step="1"
                placeholder="e.g. 3"
            >


            <label for="ownership_type">
                Physical / Digital
            </label>

            <select
                id="ownership_type"
                name="ownership_type"
                required
            >
                <option value="">Choose one</option>
                <option value="Physical">Physical</option>
                <option value="Digital">Digital</option>
            </select>

            
            <label for="review">Review</label>

            <textarea
                id="review"
                name="review"
                rows="8"
            ></textarea>

            <button type="submit">Add Game</button>

        </form>
    </main>

{% include "_footer.html" %}

</body>
</html>
