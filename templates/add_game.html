<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Game - Playdex</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Playdex</h1>
        <p>My games. My ratings. My reviews.</p>
    </header>

    <main>
        <h2>Add a Game</h2>

        <form method="POST">

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label for="title">Game title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >

            <label>Platform</label>

            {% include "_platform_picker.html" %}

            <label for="rating">Rating</label>

            <input
                type="number"
                id="rating"
                name="rating"
                min="0.1"
                max="10"
                step="0.1"
                required
            >

            <details class="advanced-logging">

                <summary>
                    Advanced Logging Options
                </summary>

                <div class="advanced-logging-content">

                    <label for="achievements_complete">
                        Platinum/All achievements
                    </label>

                    <select
                        id="achievements_complete"
                        name="achievements_complete"
                    >
                        <option
                            value=""
                            {% if not game["achievements_complete"] %}
                                selected
                            {% endif %}
                        >
                            Choose one
                        </option>

                        <option
                            value="No"
                            {% if game["achievements_complete"] == "No" %}
                                selected
                            {% endif %}
                        >
                            No
                        </option>

                        <option
                            value="Yes"
                            {% if game["achievements_complete"] == "Yes" %}
                                selected
                            {% endif %}
                        >
                            Yes
                        </option>
                    </select>


                    <label for="hours_played">
                        Hours Played
                    </label>

                    <input
                        type="number"
                        id="hours_played"
                        name="hours_played"
                        min="0"
                        step="0.1"
                        value="{{ game['hours_played'] if game['hours_played'] is not none else '' }}"
                        placeholder="e.g. 42.5"
                    >


                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                    >
                        <option
                            value=""
                            {% if not game["status"] %}
                                selected
                            {% endif %}
                        >
                            Choose status
                        </option>

                        <option
                            value="Completed"
                            {% if game["status"] == "Completed" %}
                                selected
                            {% endif %}
                        >
                            Completed
                        </option>

                        <option
                            value="Playing"
                            {% if game["status"] == "Playing" %}
                                selected
                            {% endif %}
                        >
                            Playing
                        </option>

                        <option
                            value="Did not finish"
                            {% if game["status"] == "Did not finish" %}
                                selected
                            {% endif %}
                        >
                            Did not finish
                        </option>
                    </select>


                    <label for="times_played">
                        Times Played
                    </label>

                    <input
                        type="number"
                        id="times_played"
                        name="times_played"
                        min="0"
                        step="1"
                        value="{{ game['times_played'] if game['times_played'] is not none else '' }}"
                        placeholder="e.g. 3"
                    >


                    <label for="ownership_type">
                        Physical / Digital
                    </label>

                    <select
                        id="ownership_type"
                        name="ownership_type"
                    >
                        <option
                            value=""
                            {% if not game["ownership_type"] %}
                                selected
                            {% endif %}
                        >
                            Choose one
                        </option>

                        <option
                            value="Physical"
                            {% if game["ownership_type"] == "Physical" %}
                                selected
                            {% endif %}
                        >
                            Physical
                        </option>

                        <option
                            value="Digital"
                            {% if game["ownership_type"] == "Digital" %}
                                selected
                            {% endif %}
                        >
                            Digital
                        </option>
                    </select>

                </div>

            </details>
    
            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >
                <option value="">Choose status</option>
                <option value="Completed">Completed</option>
                <option value="Playing">Playing</option>
                <option value="Did not finish">Did not finish</option>
            </select>


            <label for="times_played">
                Times Played
            </label>

            <input
                type="number"
                id="times_played"
                name="times_played"
                min="0"
                step="1"
                placeholder="e.g. 3"
            >


            <label for="ownership_type">
                Physical / Digital
            </label>

            <select
                id="ownership_type"
                name="ownership_type"
                required
            >
                <option value="">Choose one</option>
                <option value="Physical">Physical</option>
                <option value="Digital">Digital</option>
            </select>


            <label for="review">Review</label>

            <textarea
                id="review"
                name="review"
                rows="8"
            ></textarea>

            <button type="submit">Add Game</button>

        </form>
    </main>

{% include "_footer.html" %}

</body>
</html>
