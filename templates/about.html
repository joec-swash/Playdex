<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ about["title"] }} - Playdex</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Playdex</h1>

    <p>
        My games. My ratings. My reviews.
    </p>

    <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
    </nav>

    <p>
        Logged in as <strong>{{ session["username"] }}</strong>
        ·
        <a href="/logout">Log out</a>
    </p>
</header>

<main>

    <div class="about-page">

        <h2>{{ about["title"] }}</h2>

        <div class="about-content">
            {% for line in about["content"].split('\n') %}
                {{ line }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
        </div>

        {% if is_admin %}
            <p>
                <a href="{{ url_for('edit_about') }}">Edit About Page</a>
            </p>
        {% endif %}

    </div>

</main>

</body>
</html>
