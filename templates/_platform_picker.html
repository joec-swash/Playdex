<div
    class="platform-picker"
    data-platform-picker
>
    {% for platform in selected_platforms %}
        <input
            type="hidden"
            name="platform"
            value="{{ platform }}"
            class="platform-hidden-input"
        >
    {% endfor %}

    <button
        type="button"
        class="platform-picker-toggle"
        aria-expanded="false"
    >
        <span class="platform-picker-value">
            {% if selected_platforms %}
                {{ selected_platforms | join(", ") }}
            {% else %}
                Choose up to 2 platforms
            {% endif %}
        </span>

        <span aria-hidden="true">▾</span>
    </button>

    <div class="platform-menu">

        {% for brand, consoles in platform_groups.items() %}

            <div class="platform-brand">

                <button
                    type="button"
                    class="platform-brand-button"
                >
                    {{ brand }}
                </button>

                <div class="platform-submenu">

                    {% for console in consoles %}

                        <button
                            type="button"
                            class="platform-option"
                            data-value="{{ console }}"
                        >
                            {{ console }}
                        </button>

                    {% endfor %}

                </div>

            </div>

        {% endfor %}

    </div>
</div>

<script>
document.querySelectorAll("[data-platform-picker]").forEach(function (picker) {

    const toggle = picker.querySelector(".platform-picker-toggle");
    const valueDisplay = picker.querySelector(".platform-picker-value");

    function getSelectedPlatforms() {
        return Array.from(
            picker.querySelectorAll(".platform-hidden-input")
        ).map(function (input) {
            return input.value;
        });
    }

    function updateDisplay() {
        const selected = getSelectedPlatforms();

        if (selected.length === 0) {
            valueDisplay.textContent = "Choose up to 2 platforms";
        } else {
            valueDisplay.textContent = selected.join(", ");
        }

        picker.querySelectorAll(".platform-option").forEach(function (option) {
            const selected = getSelectedPlatforms();
            const isSelected = selected.includes(option.dataset.value);

            option.classList.toggle("is-selected", isSelected);

            if (selected.length >= 2 && !isSelected) {
                option.disabled = true;
            } else {
                option.disabled = false;
            }
        });
    }

    toggle.addEventListener("click", function () {
        const isOpen = picker.classList.toggle("is-open");

        toggle.setAttribute("aria-expanded", isOpen);
    });

    picker.querySelectorAll(".platform-option").forEach(function (option) {

        option.addEventListener("click", function () {

            const value = option.dataset.value;
            const selected = getSelectedPlatforms();

            if (selected.includes(value)) {

                picker
                    .querySelectorAll(".platform-hidden-input")
                    .forEach(function (input) {
                        if (input.value === value) {
                            input.remove();
                        }
                    });

            } else {

                if (selected.length >= 2) {
                    return;
                }

                const input = document.createElement("input");

                input.type = "hidden";
                input.name = "platform";
                input.value = value;
                input.className = "platform-hidden-input";

                picker.appendChild(input);
            }

            updateDisplay();
        });

    });

    picker.querySelectorAll(".platform-brand-button").forEach(function (brandButton) {

        brandButton.addEventListener("click", function () {

            const brand = brandButton.parentElement;

            picker
                .querySelectorAll(".platform-brand.is-open")
                .forEach(function (otherBrand) {

                    if (otherBrand !== brand) {
                        otherBrand.classList.remove("is-open");
                    }

                });

            brand.classList.toggle("is-open");
        });

    });

    updateDisplay();
});

document.addEventListener("click", function (event) {

    document
        .querySelectorAll("[data-platform-picker]")
        .forEach(function (picker) {

            if (!picker.contains(event.target)) {

                picker.classList.remove("is-open");

                const toggle = picker.querySelector(
                    ".platform-picker-toggle"
                );

                toggle.setAttribute("aria-expanded", "false");

                picker
                    .querySelectorAll(".platform-brand.is-open")
                    .forEach(function (brand) {
                        brand.classList.remove("is-open");
                    });

            }

        });

});
</script>
