<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit {{ game["title"] }} - Playdex</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Playdex</h1>

        <a href="/game/{{ game['id'] }}">← Back to Game</a>
    </header>

    <main>
        <h2>Edit Game</h2>

        <form method="POST">

            <label for="title">Game title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ game['title'] }}"
                required
            >

            <label for="platform">Platform</label>
            <input
                type="text"
                id="platform"
                name="platform"
                value="{{ game['platform'] or '' }}"
            >

            <label for="rating">Rating</label>
            <input
                type="number"
                id="rating"
                name="rating"
                min="0.5"
                max="10"
                step="0.5"
                value="{{ game['rating'] }}"
                required
            >

            <label for="review">Review</label>
            <textarea
                id="review"
                name="review"
                rows="8"
            >{{ game['review'] or '' }}</textarea>

            <button type="submit">Save Changes</button>

        </form>
    </main>

</body>
</html>
