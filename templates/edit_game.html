<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit {{ game["title"] }} - Playdex</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Playdex</h1>

        <a href="/game/{{ game['id'] }}">← Back to Game</a>
    </header>

    <main>
        <h2>Edit Game</h2>

        <form method="POST">

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label for="title">Game title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ game['title'] }}"
                required
            >

            <label>Platform</label>

            {% include "_platform_picker.html" %}

            <label for="rating">Rating</label>

            <input
                type="number"
                id="rating"
                name="rating"
                min="0.1"
                max="10"
                step="0.1"
                value="{{ game['rating'] }}"
                required
            >

            <details class="advanced-logging">
                <summary>Advanced Logging Options</summary>

                <div class="advanced-logging-content">

                    <label for="achievements_complete">
                        Platinum/All achievements
                    </label>

                    <select
                        id="achievements_complete"
                        name="achievements_complete"
                    >
                        <option
                            value="No"
                            {% if game['achievements_complete'] == 'No' %}
                                selected
                            {% endif %}
                        >
                            No
                        </option>

                        <option
                            value="Yes"
                            {% if game['achievements_complete'] == 'Yes' %}
                                selected
                            {% endif %}
                        >
                            Yes
                        </option>
                    </select>

                    <label for="hours_played">
                        Hours Played
                    </label>

                    <input
                        type="number"
                        id="hours_played"
                        name="hours_played"
                        min="0"
                        step="0.1"
                        value="{{ "%.1f"|format(game['hours_played']) if game['hours_played'] is not none else '' }}"
                        placeholder="e.g. 42.5"
                    >  

                </div>  
            </details>

            <label for="review">Review</label>

            <textarea
                id="review"
                name="review"
                rows="8
            >{{ game['review'] or '' }}</textarea>

            <button type="submit">Save Changes</button>
        </form>
    </main>

{% include "_footer.html" %}

</body>
</html>
